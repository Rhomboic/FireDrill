name: Deploy Dashboard

# Build the Vite/React dashboard and publish it to S3 + CloudFront whenever the
# dashboard source changes on main. Auth is via OIDC (no stored AWS keys); the
# assumed role can only touch the dashboard bucket + CloudFront invalidations.
on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch: {}

permissions:
  id-token: write   # required for OIDC
  contents: read

concurrency:
  group: deploy-dashboard
  cancel-in-progress: true

env:
  AWS_REGION: us-west-1
  BUCKET: firedrill-dashboard-673981388599
  DOMAIN: firedrill.adamissah.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build
        working-directory: dashboard
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          # Long-cache the fingerprinted assets; never cache the HTML entrypoint.
          aws s3 sync dashboard/dist/ "s3://${BUCKET}/" --delete \
            --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dashboard/dist/index.html "s3://${BUCKET}/index.html" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          CF_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Aliases.Items[?contains(@,'${DOMAIN}')]].Id" \
            --output text)
          if [ -z "$CF_ID" ] || [ "$CF_ID" = "None" ]; then
            echo "No CloudFront distribution for ${DOMAIN} yet — files synced, skipping invalidation."
            exit 0
          fi
          echo "Invalidating $CF_ID ..."
          aws cloudfront create-invalidation --distribution-id "$CF_ID" --paths "/*"
